<header class="brand-header" role="banner" aria-label="Tripura Tourism header">
  <a class="skip-link" href="#mainContent">Skip to main content</a>

  <div class="brand-shell">
    <div class="left-block">
      <a class="logo-link" [routerLink]="['/']" title="Tripura Tourism Home" aria-label="Tripura Tourism Home">
        <img src="assets/logo/tripura-agriculture.png" alt="Tripura Tourism Logo" class="logo" />
      </a>

      <div class="title-wrap">
        <div class="title-row">
          <a [routerLink]="['/']" class="site-name" title="Tripura Tourism Home">
            Tripura Tourism
          </a>
          <span class="gov-badge" aria-hidden="true">Public Portal</span>
        </div>

        <div class="site-tagline" aria-hidden="true">
          Tripura Agriculture — Cultivating Growth, Empowering Farmers
        </div>
      </div>
    </div>

    <div class="action-section" role="navigation" aria-label="Header actions">
      <div class="accessibility-bar" role="group" aria-label="Accessibility tools">
        <button
          class="sr-access"
          type="button"
          aria-haspopup="dialog"
          aria-controls="srDialog"
          [attr.aria-expanded]="dialogOpen"
          (click)="openSrDialog()">
          <span class="btn-icon" aria-hidden="true">♿</span>
          <span>Screen Reader</span>
        </button>

        <div class="read-controls" role="group" aria-label="Read page controls">
          <button type="button" class="font-btn" (click)="readPageContent()" [disabled]="reading" [attr.aria-pressed]="reading">
            Read page
          </button>

          <button type="button" class="font-btn" (click)="stopReading()" [disabled]="!reading">
            Stop
          </button>

          <label class="tts-toggle">
            <input type="checkbox" [checked]="useBrowserTTS" (change)="useBrowserTTS = !useBrowserTTS" />
            <span>Browser voice</span>
          </label>
        </div>

        <span class="divider" aria-hidden="true">|</span>

        <a href="tel:03812325930" class="helpline" aria-label="Helpline number">
          <span class="btn-icon" aria-hidden="true">☎</span>
          <span>0381&nbsp;232&nbsp;5930</span>
        </a>

        <span class="divider" aria-hidden="true">|</span>

        <div class="font-controls" role="group" aria-label="Font size controls">
          <button type="button" class="font-btn" (click)="increaseFont()" [attr.aria-pressed]="fontSize === 'large'">A+</button>
          <button type="button" class="font-btn" (click)="resetFont()" [class.active]="fontSize === 'normal'" [attr.aria-pressed]="fontSize === 'normal'">A</button>
          <button type="button" class="font-btn" (click)="decreaseFont()" [attr.aria-pressed]="fontSize === 'small'">A-</button>
        </div>
      </div>

      <app-theme-toggle></app-theme-toggle>

      <ng-container *ngIf="!isLoggedIn">
        <button class="action-btn secondary login-btn" aria-label="Login" (click)="navigateToLogin()">
          <span class="btn-icon" aria-hidden="true">⇢</span>
          <span>Login</span>
        </button>

        <button class="action-btn register-btn" aria-label="Register" (click)="navigateToRegister()">
          <span class="btn-icon" aria-hidden="true">✦</span>
          <span>Register</span>
        </button>
      </ng-container>

      <ng-container *ngIf="isLoggedIn">
        <a class="action-btn secondary" [routerLink]="['/dashboard/home']" aria-label="Dashboard">
          <span class="btn-icon" aria-hidden="true">⌂</span>
          <span>Dashboard</span>
        </a>

        <button class="action-btn primary logout-btn" aria-label="Logout" (click)="logout()">
          <span class="btn-icon" aria-hidden="true">⎋</span>
          <span>Logout</span>
        </button>
      </ng-container>

      <div id="google_translate_element" class="translate-box" aria-hidden="false"></div>
    </div>
  </div>

  <div
    #srDialog
    id="srDialog"
    class="sr-dialog-overlay"
    *ngIf="dialogOpen"
    role="dialog"
    aria-modal="true"
    aria-labelledby="srTitle"
    aria-describedby="srDesc">
    <div class="sr-dialog" role="document" tabindex="-1">
      <h2 id="srTitle">Accessibility tools</h2>
      <p id="srDesc">Quick tools for screen reader users and font controls.</p>

      <div class="sr-dialog-actions">
        <button type="button" (click)="skipToMainContent()">Skip to main content</button>
        <button type="button" (click)="enableScreenReaderMode()">Enable screen reader mode</button>
        <button type="button" (click)="closeSrDialog()">Close</button>
      </div>
    </div>
  </div>

  <div class="visually-hidden" aria-live="polite" aria-atomic="true">
    {{ liveMessage }}
  </div>
</header>
